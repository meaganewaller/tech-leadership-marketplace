config:
  ul-style:
    style: dash
  ul-indent:
    indent: 2
  line-length: false
  no-bare-urls: false
  no-inline-html: false
  no-duplicate-heading:
    siblings_only: true
  first-line-heading: false
  code-block-style: false
  # Tables here are written compact (|---|); MD060 would rewrite every one.
  table-column-style: false
ignores:
  - '**/node_modules/**'
  # Written by release-please, not by hand.
  - '**/CHANGELOG.md'
